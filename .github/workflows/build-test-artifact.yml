name: Build Test Artifact

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Package unsigned app for local testing
        run: ./scripts/package-unsigned.sh

      - name: Upload unsigned app zip
        uses: actions/upload-artifact@v4
        with:
          name: PingIsland-unsigned
          path: releases/unsigned/*.zip
          retention-days: 7
